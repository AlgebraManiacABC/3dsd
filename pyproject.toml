[project]
name = "3dsd-pipeline"
version = "0.1.0"
description = "3DS decompilation pipeline with Ninja build integration"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "ninja",
]

# No [project.scripts] entry: '3dsd' is not a valid Python identifier, so
# pip-generated console scripts (which emit a literal import statement)
# would be broken. Invoke the tool as: python -m 3dsd <command>

[tool.setuptools.packages.find]
include = ["3dsd"]

# linker.ld (final link) and base.ld (objdiff base ELF) are read at run time.
# Keyed on "*" rather than "3dsd": setuptools validates package-data keys as
# Python module names, and '3dsd' is not one (same reason there is no console
# script above). There is only the one package, so "*" means the same thing.
[tool.setuptools.package-data]
"*" = ["*.ld"]

[project.optional-dependencies]
dev = ["ruff", "pylint"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Ruff's defaults plus bugbear, pyupgrade, simplify, comprehensions, import
# order and pathlib. Pylint covers the design checks, so PL* is left to it.
extend-select = ["E", "W", "B", "UP", "SIM", "C4", "PIE", "RUF", "I", "PTH"]
ignore = [
    "N999",     # '3dsd' is the package name by design; see the note above
    "RUF001",   # the em dashes and arrows in user-facing strings are intended
    "RUF002",
    "RUF003",
]

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.basic]
# '3dsd' starts with a digit, which snake_case forbids; it is the package name.
module-rgx = "^(3dsd|[a-z_][a-z0-9_]*)$"
# Standard names from the ELF and ARM ABI specifications (A = addend,
# P = place) read better than invented snake_case ones.
good-names = ["A", "P", "i", "j", "e", "f", "d", "m", "r", "s", "b", "o", "n", "k", "td"]
# Short helpers (a struct read, a one-line accessor) are self-describing, as
# are the symmetric write/from_reader serialisers every format class carries.
docstring-min-length = 8
no-docstring-rgx = "^(_|write$|from_reader$)"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
# Parsers for fixed binary formats naturally read many fields at once.
max-args = 8
max-positional-arguments = 8
max-locals = 25
max-branches = 15
max-statements = 60
max-attributes = 12
min-public-methods = 0
