[project]
name = "3dsd-pipeline"
version = "0.1.0"
description = "3DS decompilation pipeline with Ninja build integration"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "ninja",
]

# No [project.scripts] entry: '3dsd' is not a valid Python identifier, so
# pip-generated console scripts (which emit a literal import statement)
# would be broken. Invoke the tool as: python -m 3dsd <command>

[tool.setuptools.packages.find]
include = ["3dsd"]

# linker.ld (final link) and base.ld (objdiff base ELF) are read at run time.
# Keyed on "*" rather than "3dsd": setuptools validates package-data keys as
# Python module names, and '3dsd' is not one (same reason there is no console
# script above). There is only the one package, so "*" means the same thing.
[tool.setuptools.package-data]
"*" = ["*.ld"]
